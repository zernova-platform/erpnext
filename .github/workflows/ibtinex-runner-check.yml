name: IBTINEX runner check

on:
  push:
    branches: [ibtinex/starter-0.1.0]
    paths: [.github/workflows/ibtinex-runner-check.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the isolated Docker build runner
        run: |
          docker version
          docker compose version
          df -h /var/lib/docker
