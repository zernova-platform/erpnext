name: IBTINEX / Build, verify and publish candidate

on:
  push:
    branches: [ibtinex/starter-0.1.0]
    paths:
      - erpnext/**
      - deploy/ibtinex/**
      - .github/workflows/ibtinex-image.yml
      - pyproject.toml
      - package.json
      - yarn.lock
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested review candidate to the private GHCR package
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ibtinex-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    if: github.repository == 'zernova-platform/erpnext'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IBTINEX_IMAGE_REPOSITORY: ghcr.io/zernova-platform/ibtinex-erpnext
      IBTINEX_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Check out the pinned Framework schema for fixture validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: frappe/frappe
          ref: 2df0425571ebbaed878eabc3edc5b7e7c3327ae0
          path: .ibtinex-framework-source
          persist-credentials: false
      - name: Validate deployment guardrails
        env:
          FRAPPE_SOURCE_ROOT: ${{ github.workspace }}/.ibtinex-framework-source
        run: |
          python3 -m unittest discover -s deploy/ibtinex/tests -v
          python3 erpnext/tests/test_ibtinex_branding.py -v
          python3 -m unittest discover -s erpnext/ibtinex_starter/tests -v
      - name: Resolve and record exact build inputs
        id: prepare
        run: python3 deploy/ibtinex/ci.py prepare
      - name: Build the candidate once
        timeout-minutes: 25
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/ibtinex-build
          file: ${{ runner.temp }}/ibtinex-build/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ibtinex-ci:${{ github.sha }}
          build-args: |
            PYTHON_BASE_IMAGE=${{ steps.prepare.outputs.python_base_image }}
            NODE_VERSION=${{ steps.prepare.outputs.node_version }}
            ERP_COMMIT=${{ github.sha }}
            CACHE_BUST=${{ github.sha }}
          secret-files: |
            apps_json=${{ runner.temp }}/ibtinex-apps.json
          cache-from: type=gha,scope=ibtinex-erp-v16
          cache-to: type=gha,mode=max,scope=ibtinex-erp-v16
      - name: Exercise fresh site and starter data, then publish the tested image
        run: python3 deploy/ibtinex/ci.py verify-publish
      - name: Retain source and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ibtinex-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ibtinex-evidence/
          if-no-files-found: warn
          retention-days: 30
