name: IBTINEX / Diagnostic runtime only

on:
  push:
    branches: [ibtinex/starter-0.1.0]
    paths:
      - erpnext/**
      - deploy/ibtinex/**
      - .github/workflows/ibtinex-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibtinex-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    if: github.repository == 'zernova-platform/erpnext'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IBTINEX_PUBLISH: 'false'
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the exact upstream comparison tree
        run: git fetch --depth=1 origin 886ab6ae187244e7f1b852393384ab6019d56264
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Prepare the exact source overlay
        run: python3 deploy/ibtinex/diagnostic/prepare.py prepare
      - name: Build the isolated diagnostic image
        timeout-minutes: 10
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ runner.temp }}/ibtinex-build
          file: ${{ runner.temp }}/ibtinex-build/diagnostic/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ibtinex-ci:${{ github.sha }}
          build-args: |
            ERP_COMMIT=${{ github.sha }}
      - name: Run the existing native qualification without publication
        run: |
          python3 deploy/ibtinex/ci.py verify-publish
          python3 deploy/ibtinex/diagnostic/prepare.py finalize
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ibtinex-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/ibtinex-evidence/
          if-no-files-found: warn
          retention-days: 14
